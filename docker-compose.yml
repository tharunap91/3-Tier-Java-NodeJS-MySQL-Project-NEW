name: projectops-java

services:

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projectops}
      MYSQL_USER: ${MYSQL_USER:-projectops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-projectops123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - database-network

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DB_URL: >-
        jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-projectops}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-projectops}
      DB_PASSWORD: ${MYSQL_PASSWORD:-projectops123}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - application-network
      - database-network

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:8080"

    depends_on:
      - backend

    networks:
      - application-network

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: unless-stopped


volumes:
  mysql-data:


networks:
  application-network:

  database-network:
    internal: true
